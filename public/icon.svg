<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Glass highlight shimmer -->
  <ellipse cx="256" cy="110" rx="230" ry="108" fill="url(#shine)"/>
  <!-- Building: base platform -->
  <rect x="96" y="368" width="320" height="34" rx="17" fill="white"/>
  <!-- Building: left pillar -->
  <rect x="134" y="262" width="40" height="110" rx="8" fill="white" opacity="0.92"/>
  <!-- Building: right pillar -->
  <rect x="338" y="262" width="40" height="110" rx="8" fill="white" opacity="0.92"/>
  <!-- Building: arch dome -->
  <path d="M108 280 C108 130 256 118 256 118 C256 118 404 130 404 280" fill="white"/>
  <!-- Door -->
  <rect x="214" y="280" width="84" height="122" rx="12" fill="url(#bg)"/>
  <!-- Door arch top -->
  <ellipse cx="256" cy="280" rx="42" ry="24" fill="url(#bg)"/>
  <!-- Door handle -->
  <circle cx="234" cy="346" r="8" fill="rgba(255,255,255,0.4)"/>
</svg>
